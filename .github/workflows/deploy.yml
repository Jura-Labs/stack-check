# Deploys the site files to GitHub Pages at check.juralabs.org.
#
# Manual only until launch. The rule 10 record
# (jura-brain decisions/2026-09-29-stack-check-repo-and-pages.md) does not
# authorise launching before the user tests in Drive doc 24, so merging to main
# does not publish. At launch, Paul adds "push: branches: [main]" here and
# removes the noindex tag and robots.txt block.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "1"
      - name: Collect the site files (no tests, tooling or prototype)
        run: |
          mkdir _site
          cp -R index.html 404.html CNAME robots.txt favicon.svg favicon.png assets downloads research \
                LICENSE LICENSE-CONTENT NOTICE CHANGELOG.md SECURITY.md _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
